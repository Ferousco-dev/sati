services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sati
      POSTGRES_PASSWORD: sati
      POSTGRES_DB: sati
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sati"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  proxy:
    image: caddy:2
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
