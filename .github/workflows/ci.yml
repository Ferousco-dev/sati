name: ci

on:
  push:
    branches: [backend]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sati
          POSTGRES_PASSWORD: sati
          POSTGRES_DB: sati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sati"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sati:sati@localhost:5432/sati_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
