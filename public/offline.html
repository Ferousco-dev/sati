<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#268adc" />
    <title>You are offline — SATI-L</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Instrument Sans", Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.5rem;
        border-radius: 1rem;
        background: #268adc;
        color: #fff;
        font-size: 2.25rem;
        font-weight: 700;
        line-height: 4rem;
      }
      h1 { margin: 0 0 0.75rem; font-size: 1.75rem; text-transform: uppercase; letter-spacing: 0.02em; }
      p { margin: 0 0 1.5rem; color: #475569; line-height: 1.5; }
      button {
        padding: 0.875rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: #0f3b63;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>You are offline</h1>
      <p> Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
