      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: ["Catalog admin"]
      summary: "Switch a product on or off for ordering."
      x-access: staff
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                available: {type: boolean}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/products/{id}/images":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: ["Catalog admin"]
      summary: "Upload a JPEG, PNG or WebP image (max 5MB, multipart field image)."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: {type: string, format: binary}
      responses:
        '201':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/products/{id}/images/{imageId}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: imageId
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: ["Catalog admin"]
      summary: "Remove a product image."
      x-access: admin
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/riders:
    get:
      tags: ["Admin"]
      summary: "List users with the RIDER role."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/settings:
    get:
      tags: ["Settings"]
      summary: "Read store settings."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: ["Settings"]
      summary: "Change store settings."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_name: {type: string}
                store_address: {type: string}
                store_phone: {type: string}
                store_email: {type: string}
                instagram_url: {type: string}
                tiktok_url: {type: string}
                facebook_url: {type: string}
                map_embed_url: {type: string}
                opening_hours: {description: "object with mon..sun, each {open, close} as HH:MM or null"}
                temporarily_closed: {type: boolean}
                closed_message: {type: string}
                delivery_fee_kobo: {type: integer}
                online_enabled: {type: boolean}
                bank_transfer_enabled: {type: boolean}
                pay_on_pickup_enabled: {type: boolean}
                pay_on_delivery_enabled: {type: boolean}
                bank_name: {type: string}
                bank_account_number: {type: string}
                bank_account_name: {type: string}
                whatsapp_number: {type: string}
                whatsapp_message: {type: string}
                notification_email: {type: string}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/users:
    get:
      tags: ["Admin"]
      summary: "List users, optionally by role."
      x-access: admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: ["Admin"]
      summary: "Invite a STAFF, RIDER or ADMIN user by email."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                email: {type: string}
                role: {description: "STAFF|RIDER|ADMIN"}
      responses:
        '201':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
