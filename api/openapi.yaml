openapi: 3.0.3
info:
  title: SATI Yoghurt API
  version: 1.0.0
  description: |
    REST API for the SATI Yoghurt ordering platform. Money is always an integer in kobo.
    Sessions use the HttpOnly cookie sati_session. Every error is {"error":{"code":"...","message":"..."}}.
    Each operation lists who may call it in x-access: public, customer (any signed-in user), staff, admin, rider or metrics.
servers:
  - url: http://localhost:8080
    description: Local development
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sati_session
    metricsToken:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  responses:
    BadRequest:
      description: "Validation failed or the body is not valid JSON."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: "Not signed in."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: "Signed in without the required role, or the request origin is not allowed."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: "The resource does not exist or belongs to someone else."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: "The request conflicts with the current state."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: "Rate limit reached. See the Retry-After header."
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
paths:
  /api/v1/addresses:
    get:
      tags: ["Addresses"]
      summary: "List the customer's saved addresses."
      x-access: customer
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: ["Addresses"]
      summary: "Save an address."
      x-access: customer
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_name: {type: string}
                phone: {type: string}
                address_line: {type: string}
                area: {type: string}
                city: {type: string}
                instructions: {type: string}
                zone_id: {type: string}
      responses:
        '201':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/addresses/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: ["Addresses"]
      summary: "Delete a saved address."
      x-access: customer
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: ["Addresses"]
      summary: "Update a saved address."
      x-access: customer
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_name: {type: string}
                phone: {type: string}
                address_line: {type: string}
                area: {type: string}
                city: {type: string}
                instructions: {type: string}
                zone_id: {type: string}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/audit-logs:
    get:
      tags: ["Admin"]
      summary: "Search the audit log."
      x-access: admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/categories:
    get:
      tags: ["Catalog admin"]
      summary: "List all categories."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: ["Catalog admin"]
      summary: "Create a category."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                sort_order: {type: integer}
      responses:
        '201':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/categories/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: ["Catalog admin"]
      summary: "Update a category."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                sort_order: {type: integer}
                active: {type: boolean}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/customers:
    get:
      tags: ["Admin"]
      summary: "List customers with order counts and total spent."
      x-access: admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/dashboard:
    get:
      tags: ["Admin"]
      summary: "Today's orders, revenue and the open order queue. Accepts ?tz=."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/delivery:
    get:
      tags: ["Delivery admin"]
      summary: "List deliveries."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/delivery/zones:
    get:
      tags: ["Delivery admin"]
      summary: "List all delivery zones."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: ["Delivery admin"]
      summary: "Create a delivery zone."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                fee_kobo: {type: integer}
                sort_order: {type: integer}
      responses:
        '201':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/delivery/zones/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: ["Delivery admin"]
      summary: "Update a delivery zone."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                fee_kobo: {type: integer}
                active: {type: boolean}
                sort_order: {type: integer}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/orders:
    get:
      tags: ["Admin orders"]
      summary: "List orders with filters."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/orders/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: ["Admin orders"]
      summary: "Get an order with customer, payments and delivery."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/orders/{id}/payment":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: ["Admin orders"]
      summary: "Record a cash or bank transfer payment as received."
      x-access: staff
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/orders/{id}/rider":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: ["Admin orders"]
      summary: "Assign or reassign a rider."
      x-access: staff
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rider_id: {type: string}
                notes: {type: string}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/orders/{id}/status":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: ["Admin orders"]
      summary: "Move an order to its next status."
      x-access: staff
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string}
                reason: {type: string}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/payments:
    get:
      tags: ["Admin payments"]
      summary: "List payments. Filter with ?needs_refund=true."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/payments/{id}/refunded":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: ["Admin payments"]
      summary: "Record that a paid payment was refunded."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: {type: string}
      responses:
        '204':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/products:
    get:
      tags: ["Catalog admin"]
      summary: "List products for management, including archived."
      x-access: staff
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: ["Catalog admin"]
      summary: "Create a product."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id: {type: string}
                name: {type: string}
                description: {type: string}
                price_kobo: {type: integer}
      responses:
        '201':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/products/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: ["Catalog admin"]
      summary: "Update a product."
      x-access: admin
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id: {type: string}
                name: {type: string}
                description: {type: string}
                price_kobo: {type: integer}
                active: {type: boolean}
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/products/{id}/archive":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: ["Catalog admin"]
      summary: "Archive a product."
      x-access: admin
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Success.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  "/api/v1/admin/products/{id}/availability":
